<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>상품 팝업</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .modal-box {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 0 24px rgba(80,120,200,0.08), 0 2px 12px rgba(0,0,0,0.06);
      padding: 28px 28px 22px 28px;
      min-width: 260px;
      max-width: 350px;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Pretendard', 'sans-serif', Arial;
      margin: 60px auto;
    }
    .modal-title {
      margin: 0 0 6px 0;
      font-size: 1.10rem;
      font-weight: bold;
      color: #222;
      letter-spacing: -0.03em;
      text-align: center;
    }
    .modal-desc {
      margin: 0 0 20px 0;
      font-size: 0.95rem;
      color: #647087;
      text-align: center;
    }
    .quantity-controller {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f8fafd;
      padding: 8px 13px;
      border-radius: 10px;
      font-size: 1rem;
      margin-bottom: 24px;
      width: fit-content;
    }
    .delete-btn {
      background: #ececec;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      color: #575e6e;
      padding: 6px 17px;
      cursor: pointer;
      transition: background 0.16s;
    }
    .delete-btn:hover {
      background: #e1e7ee;
    }
    .qty-btn {
      width: 28px;
      height: 28px;
      border: 1px solid #e3e7ee;
      background: #fff;
      color: #848a98;
      border-radius: 50%;
      font-size: 1.18rem;
      text-align: center;
      cursor: pointer;
      outline: none;
      user-select: none;
      transition: background 0.13s, color 0.12s;
    }
    .qty-btn:active {
      background: #f0f2f7;
      color: #676c7e;
    }
    .qty-value {
      margin: 0 8px;
      font-size: 1.09rem;
      width: 18px;
      display: inline-block;
      text-align: center;
      color: #222;
    }
    .btn-bar {
      margin-top: 10px;
      width: 100%;
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .modal-action-btn {
      flex: 1 1 0;
      padding: 11px 0;
      font-size: 1.02rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.15s, color 0.12s;
    }
    .modal-action-btn.cancel {
      background: #ececec;
      color: #4c4c4e;
    }
    .modal-action-btn.cancel:hover {
      background: #888889;
    }
    .modal-action-btn.confirm {
      background:ㅊ;
      color: #4c4c4e;
    }
    .modal-action-btn.confirm:hover {
      background: #ececec;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="modal-box">
    <h2 class="modal-title"> 재료명</h2>
    <div class="quantity-controller">
     
      <button class="qty-btn" id="qty-decrease">−</button>
      <span class="qty-value" id="qty-value">1</span>
      <button class="qty-btn" id="qty-increase">+</button>
      <button class="delete-btn">삭제</button>
    </div>
    <div class="btn-bar">
      <button class="modal-action-btn cancel">취소</button>
      <button class="modal-action-btn confirm">확인</button>
    </div>
  </div>
  <script>
    const valueSpan = document.getElementById('qty-value');
    const decreaseBtn = document.getElementById('qty-decrease');
    const increaseBtn = document.getElementById('qty-increase');
    let qty = 1;
    decreaseBtn.onclick = function () {
      if (qty > 1) {
        qty--;
        valueSpan.textContent = qty;
      }
    };
    increaseBtn.onclick = function () {
      qty++;
      valueSpan.textContent = qty;
    };
  </script>
</body>
</html>
