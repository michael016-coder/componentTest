<!DOCTYPE html>
<html lang="ko">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

<head>
    <meta charset="UTF-8">
    <title>2단 분할 후 상단 3등분 - 구분선 없음</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contentsbox {
            width: 600px;
            height: 200px;
            background: #ffffff8f;
            border-radius: 8px;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.03);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .top-section {
            flex: 1;
            display: flex;

        }

        .top-section>div {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 1.1rem;
        }

        .bottom-section {
            flex: 1;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            height: 20%;
            text-align: left;
            
        }

    </style>
</head>

<body>
    <div class="contentsbox">
        <div class="top-section">
            <div class="ingredient-name">재료명</div>
            <div class="qty">n</div>
            <div class="days">+1d</div>
        </div>
        <div class="bottom-section" >

         
                <div class="mb-3" style="text-align: left; width: 400px; height: 10px;">
                    <textarea class="form-control rounded-3 shadow-sm" id="commentBox" rows="1" style="width: 70%;" ></textarea>
                </div>
        </div>
    </div>
</body>

</html>
