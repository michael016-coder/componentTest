<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>SearchedList</title>
  <style>
    body {
      font-family: 'Segoe UI', 'Apple SD Gothic Neo', Arial, sans-serif;
      background: #fafbfc;
      padding: 30px;
    }
    .search-results {
      max-width: 400px;
      margin: 0 auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(60,70,100,0.07);
      padding: 12px 0;
    }
    .searched-ingredient {
      padding: 16px 24px;
      border-bottom: 1px solid #f0f2f4;
      font-size: 1.1em;
      color: #23272e;
      cursor: pointer;
      transition: background 0.14s;
    }
    .searched-ingredient:last-child {
      border-bottom: none;
    }
    .searched-ingredient:hover {
      background: #f3f6fa;
    }
  </style>
</head>
<body>
  <div class="search-results">
    <div class="searched-ingredient">예시</div>
    <div class="searched-ingredient">예시</div>
    <div class="searched-ingredient">예시</div>
    <div class="searched-ingredient">예시</div>
    <div class="searched-ingredient">예시</div>
   
  </div>
</body>
</html>
