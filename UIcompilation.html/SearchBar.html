<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <title>Document</title>
    <style>
        .simple-search-box {
            position: relative;
            width: 400px;
            margin: 40px auto;
        }

        .simple-search-input {
            width: 100%;
            height: 48px;
            padding-left: 20px;
            padding-right: 44px;
            font-size: 1.1rem;
            border: none;
            border-radius: 2em;
            background: #fff;
            box-shadow: 0 2px 8px 0 #0001;
            outline: none;
            box-sizing: border-box;
        }

        .simple-search-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.4em;
            color: #3f3f3f;
            pointer-events: none;
        }
    </style>
</head>

<body>

    <div class="simple-search-box">
        <input type="text" class="simple-search-input" placeholder="재료명">
        <i class="bi bi-search simple-search-icon"></i>
    </div>
</body>

</html>
