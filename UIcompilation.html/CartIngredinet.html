<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>검색 결과 예시 리스트 + 체크박스 + 삭제버튼</title>
    <!-- FontAwesome CDN 추가 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', 'Apple SD Gothic Neo', Arial, sans-serif;
            padding: 30px;
        }
        .cart-ingredientlist {
            max-width: 420px;
            margin: 0 auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(60,70,100,0.07);
            padding: 12px 0;
        }
        .result-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid #f0f2f4;
            font-size: 1.1em;
            color: #23272e;
            transition: background 0.14s;
        }
        .result-item:last-child {
            border-bottom: none;
        }
        .result-item:hover {
            background: #f3f6fa;
        }
        .checkbox-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .delete-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            margin: 0 4px 0 0;
            display: flex;
            align-items: center;
            outline: none;
            color: #cd2922;
            font-size: 20px;
        }
        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #278cf7;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="cart-ingredientlist">
        <div class="result-item">
            예시 1
            <span class="checkbox-area">
                <button class="delete-btn" aria-label="삭제">
                    <i class="fa-solid fa-circle-minus"></i>
                </button>
                <input type="checkbox">
            </span>
        </div>
