<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>메인 바탕</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            background: #faf9f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        .main-box {
            width: clamp(360px, 50vw, 800px);
            min-height: clamp(300px, 55vh, 650px);
            padding: clamp(20px, 4vw, 48px);
            background: #fff;
            border-radius: 32px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.13), 0 2px 10px rgba(169, 169, 170, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.02em;
            margin-top: 8vh;
            margin-bottom: 8vh;
        }
        @media (max-width: 700px) {
            .main-box {
                max-width: 98vw;
                min-height: 260px;
                padding: 28px 8vw;
                margin-top: 4vh;
                margin-bottom: 4vh;
            }
        }
    </style>
</head>
<body>
    <div class="main-box">

        <!-- contents-box -->
        <div class="contents-box">
            <ul class="cart-ingredient-list">
                <li class="cart-ingredient">
                    <button class="delete-button"><i class="fas fa-trash"></i></button>
                    <button class="ingredient-category-button"></button>
                    <!-- 아이콘을 두개를 써야하는데(냉장고랑 돋보기) 이걸 버튼 하나로 둘지 두개로 될지 몰겠슈 -->
                </li>
            </ul>

            <div class="cart-buttons">
                <button class="clear-button">초기화</button>
                <button class="search-recipe-button">레시피 탐색</button>
            </div>
        </div>

        <!-- contents-box -->
        <div class="contents-box">
            <ul class="recipe-list">
                <li class="recipe-info">
                    <img class="recipe-photo" src="#">
                    <div class="recipe-name-card"></div>
                    <div class="needs"></div>
                </li>
            </ul>
        </div>

    </div>
</body>
</html>
