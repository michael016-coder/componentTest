<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>메인 바탕</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            max-height: 100vh;
            background: #faf9f8;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .main-box {
            width: clamp(360px, 50vw, 800px);
            min-height: clamp(300px, 55vh, 650px);
            padding: clamp(20px, 4vw, 48px);
            background: #fff;
            border-radius: 32px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.13), 0 2px 10px rgba(169, 169, 170, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.02em;
            margin-top: 8vh;
            margin-bottom: 8vh;
            position: relative;
        }
        .mini-add-popup {
            padding: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            border-radius: 18px;
            border: 1px solid #333;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.13);
            padding: 28px 22px;
            min-width: 180px;
            max-width: 90vw;
            text-align: center;
            z-index: 30;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .main-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(60, 60, 60, 0.22);
            border-radius: 32px;
            z-index: 10;
            pointer-events: none;
        }

        .fridge-title {
            position: absolute;
            top: 32px;
            left: 40px;
            margin: 0;
            font-size: 2.2rem;
            font-weight: bold;
        }

        .adding-box {
            position: absolute;
            width: 75%;
            height: 90%;
            background: #fff;
            border: 1px solid #f0eeee;
            border-radius: 32px;
            box-shadow: 0 16px 48px rgba(88, 88, 88, 0.13), 0 2px 10px rgba(102, 102, 102, 0.08);
            z-index: 20;
            opacity: 1;
            pointer-events: auto;
        }
        .adding-box h2 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 16px;
            padding-top: 16px;
        }
        .adding-box form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
        }

        .ingredient-list {
            width: 100%;
            margin: 0%;
            display: block;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
            margin-top: 80px;
            padding: 0;
            max-height: 60vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #d9d9d7 #faf9f8;
            list-style: none;
        }

        .ingredient-list li {
            margin: 0 auto 18px auto;
            background: #d7d7d7;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            padding: 18px 32px;
            font-size: 1.1rem;
            color: #333;

            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 90px;
            min-height: 40px;
            max-width: 320px;
            transition: box-shadow 0.2s;
        }

        .ingredient-list::-webkit-scrollbar {
            width: 8px;
            border-radius: 8px;
            background: #faf9f8;
        }

        .ingredient-list::-webkit-scrollbar-thumb {
            background: #d9d9d7;
            border-radius: 8px;
        }

        .ingredient-list li:hover {
            box-shadow: 0 4px 16px rgba(226, 226, 222, 0.096);
            background: #c5c5c4;
        }

        .main-box p {
            font-size: 1.15rem;
            text-align: center;
        }

        .side-floating-btns {
            position: absolute;
            right: 32px;
            bottom: 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 10;
        }

        .circle-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #d9d9d7;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .circle-btn:hover {
            background: #ffd43b;
        }

        .fa-plus {
            transform: rotate(45deg);
        }

        .bottom-nav {
            width: clamp(320px, 40vw, 600px);
            height: clamp(40px, 6vh, 60px);
            padding: clamp(8px, 1vw, 20px);
            opacity: 0.95;
            background: linear-gradient(90deg, white 0%, #e0e0e0 100%);
            box-shadow: 0 12px 48px rgba(118, 119, 119, 0.23), 0 4px 16px rgba(0, 0, 0, 0.11);
            border-radius: 999px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            transition: box-shadow 0.2s;
            margin-bottom: 12vh;
        }

        .bottom-nav:hover {
            box-shadow: 0 18px 64px rgba(160, 161, 161, 0.28), 0 8px 24px rgba(0, 0, 0, 0.14);
        }

        .nav-item {
            flex: 1;
            text-align: center;
            text-decoration: none;
            color: #fff;
            transition: transform 0.22s cubic-bezier(.4, 2.3, .3, .9);
        }

        .nav-icon {
            width: 80px;
            height: 80px;
            object-fit: contain;
            display: inline-block;
            vertical-align: middle;
            transition: transform 0.22s cubic-bezier(.4, 2.3, .3, .9);
            filter: drop-shadow(0 1px 8px rgba(230, 232, 233, 0.14));
        }

        .nav-item:hover .nav-icon,
        .nav-item:focus .nav-icon {
            transform: scale(1.18) rotate(-8deg);
            filter: drop-shadow(0 2px 13px rgba(240, 209, 77, 0.29));
            padding-top: clamp(2px, 0.5vw, 4px);
        }

        @media (max-width: 700px) {
            .main-box {
                max-width: 100vw;
                min-height: 260px;
                padding: 8px 2vw;
                margin-top: 4vh;
                margin-bottom: 4vh;
            }

            #profile-button {
                z-index: 2000;
            }
        }

    </style>
</head>

<body>
    <button id="profile-button" class="circle-btn" style="position: fixed; top: 16px; right: 16px; ">
        <i class="fa-solid fa-user"></i></button>
    <div class="main-box">
        <!-- 팝업 외에 어둡게 -->
        <div class="main-overlay"></div>
        <h2 class="fridge-title">My Fridge</h2>

        <div class="side-floating-btns">
            <button id="add-button" class="circle-btn"><i class="fa-solid fa-plus"></i></button>
            <button id="edit-button" class="circle-btn"><i class="fa-solid fa-pen-to-square"></i></button>
        </div>
        <!-- adding-box -->
        <div class="adding-box">
            <div class="search-bar">
            </div>
        </div>
        <!-- ingredient-list -->
        <ul class="ingredient-list">
            <!-- ingredient -->
            <li class="ingredient">
                <span>재료 1</span>
            </li>
        </ul>
    </div>
    <nav class="bottom-nav">
        <a href="#" class="nav-item" title="나의 냉장고">
            <img src="icons/RefrigeratorIcon.png" alt="Refrigerator Icon" class="nav-icon">
        </a>
        <a href="#" class="nav-item" title="레시피 탐색">
            <img src="icons/searchIcon.png" alt="Search Icon" class="nav-icon">
        </a>
        <a href="#" class="nav-item" title="장바구니">
            <img src="icons/addCartIcon.png" alt="Add Cart Icon" class="nav-icon">
        </a>
        <a href="#" class="nav-item" title="히스토리">
            <img src="icons/HistoryIcon.png" alt="History Icon" class="nav-icon">
        </a>
    </nav>
    
</body>

</html>
