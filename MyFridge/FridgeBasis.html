<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>메인 바탕</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Font Awesome 6 이상 (CDN 최신버전 예시) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body {
            margin: 0;
            max-height: 100vh;
            background: #faf9f8;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .mainBox {
            width: clamp(360px, 50vw, 800px);
            min-height: clamp(300px, 55vh, 650px);
            padding: clamp(20px, 4vw, 48px);
            background: #fff;
            border-radius: 32px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.13), 0 2px 10px rgba(169, 169, 170, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.02em;
            margin-top: 8vh;
            margin-bottom: 8vh;
            position: relative;
        }

        .fridgeTitle {
            position: absolute;
            top: 32px;
            left: 40px;
            margin: 0;
            font-size: 2.2rem;
            font-weight: bold;
        }

        .ingredientList {
            width: 100%;
            margin: 0%;
            display: block;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
            margin-top: 80px;
            padding: 0;
            max-height: 60vh;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #d9d9d7 #faf9f8;
            list-style: none;
        }

        .ingredientList li {
            margin: 0 auto 18px auto;
            background: #d7d7d7;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            padding: 18px 32px;
            font-size: 1.1rem;
            color: #333;

            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 90px;
            min-height: 40px;
            max-width: 320px;
            transition: box-shadow 0.2s;
        }

        .ingredientList::-webkit-scrollbar {
            width: 8px;
            border-radius: 8px;
            background: #faf9f8;
        }

        .ingredientList::-webkit-scrollbar-thumb {
            background: #d9d9d7;
            border-radius: 8px;
        }

        .ingredientList li:hover {
            box-shadow: 0 4px 16px rgba(226, 226, 222, 0.096);
            background: #c5c5c4;
        }

        .mainBox p {
            font-size: 1.15rem;
            text-align: center;
        }

        .sideFloatingBtns {
            position: absolute;
            right: 32px;
            bottom: 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 10;
        }

        .circleBtn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #d9d9d7;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .circleBtn:hover {
            background: #ffd43b;
        }

        .fa-plus {
            transition: transform 0.5s cubic-bezier(.45, 2, .65, .9);
        }

        .fa-plus:hover {
            transform: rotate(-45deg);
        }

        .bottomNav {
            width: clamp(320px, 40vw, 600px);
            height: clamp(40px, 6vh, 60px);
            padding: clamp(8px, 1vw, 20px);
            opacity: 0.95;
            background: linear-gradient(90deg, white 0%, #e0e0e0 100%);
            box-shadow: 0 12px 48px rgba(118, 119, 119, 0.23), 0 4px 16px rgba(0, 0, 0, 0.11);
            border-radius: 999px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            transition: box-shadow 0.2s;
            margin-bottom: 12vh;
        }

        .bottomNav:hover {
            box-shadow: 0 18px 64px rgba(160, 161, 161, 0.28), 0 8px 24px rgba(0, 0, 0, 0.14);
        }

        .navItem {
            flex: 1;
            text-align: center;
            text-decoration: none;
            color: #fff;
            transition: transform 0.22s cubic-bezier(.4, 2.3, .3, .9);
        }

        .navIcon {
            width: 80px;
            height: 80px;
            object-fit: contain;
            display: inline-block;
            vertical-align: middle;
            transition: transform 0.22s cubic-bezier(.4, 2.3, .3, .9);
            filter: drop-shadow(0 1px 8px rgba(230, 232, 233, 0.14));
        }

        .navItem:hover .navIcon,
        .navItem:focus .navIcon {
            transform: scale(1.18) rotate(-8deg);
            filter: drop-shadow(0 2px 13px rgba(240, 209, 77, 0.29));
            padding-top: clamp(2px, 0.5vw, 4px);
        }

        @media (max-width: 700px) {
            .mainBox {
                max-width: 100vw;
                min-height: 260px;
                padding: 8px 2vw;
                margin-top: 4vh;
                margin-bottom: 4vh;
            }

            #profileButton {
                z-index: 2000;
            }
        }

        footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            text-align: center;
            font-size: 13px;
            color: #888ca7;
            padding: 10px 0 8px 0;
            background: transparent;
            z-index: 1500;
            pointer-events: none;
            user-select: none;
        }

        footer small a {
            color: #aaa;
            text-decoration: underline;
            pointer-events: auto;
            user-select: auto;
        }


        @media (max-width: 480px) {
            footer {
                font-size: 12px;
                padding: 11px 0 8px 0;
            }
        }
    </style>
</head>

<body>
    <button id="profileButton" class="circleBtn" style="position: fixed; top: 16px; right: 16px; ">
        <i class="fa-solid fa-user"></i></button>
    <div class="mainBox">

        <h2 class="fridgeTitle">my fridge</h2>

        <div class="sideFloatingBtns">
            <button id="addButton" class="circleBtn"><i class="fa-solid fa-plus"></i></button>
            <button id="editButton" class="circleBtn"><i class="fa-solid fa-pen-to-square"></i></button>
        </div>

        <ul class="ingredientList">
            <li class="ingredient">
                <span>재료 1</span>
            </li>
        </ul>

    </div>

    </div>
    <nav class="bottomNav">
        <a href="#" class="navItem" title="나의 냉장고">
            <img src="icons/RefrigeratorIcon.png" alt="Refrigerator Icon" class="navIcon">
        </a>
        <a href="#" class="navItem" title="레시피 탐색">
            <img src="icons/searchIcon.png" alt="Search Icon" class="navIcon">
        </a>
        <a href="#" class="navItem" title="장바구니">
            <img src="icons/addCartIcon.png" alt="Add Cart Icon" class="navIcon">
        </a>
        <a href="#" class="navItem" title="히스토리">
            <img src="icons/HistoryIcon.png" alt="History Icon" class="navIcon">
        </a>
    </nav>
    <footer>
        <small>
            Icons by <a href="https://www.flaticon.com/authors/freepik" target="_blank" rel="noopener">Freepik</a> /
            Powered by <a href="https://fontawesome.com/" target="_blank" rel="noopener">Font Awesome</a>
        </small>
    </footer>
</body>

</html>
