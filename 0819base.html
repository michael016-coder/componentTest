<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>메인 바탕</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            background: #faf9f8;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        .main-box {
            width: clamp(360px, 50vw, 800px);
            min-height: clamp(300px, 55vh, 650px); /* 세로 길이 늘림 */
            padding: clamp(20px, 4vw, 48px);
            background: #fff;
            border-radius: 32px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.13), 0 2px 10px rgba(169, 169, 170, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.02em;
            margin-top: 8vh;
            margin-bottom: 8vh;
        }
       
 

        @media (max-width: 700px) {
            .main-box {
                max-width: 98vw;
                min-height: 260px;
                padding: 28px 8vw;
                margin-top: 4vh;
                margin-bottom: 4vh;
            }
        }
    </style>

    <body>
        <div class="main-box">
            





        </div>
    </body>
</html>
