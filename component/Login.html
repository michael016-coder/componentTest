<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReciPick</title>
       <style>
        * {
            box-sizing: border-box;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: white;
        }
        .component {
            background: #fff;
            border: 0.5px solid #000;
            border-radius:12px;
            width: 350px;
            min-height: 500px;
            box-shadow: 0 4px 4px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }
        .logintab form {
            display: flex;
            flex-direction: column;
            gap: 3px; /* 간격을 좁힘 */
            width: 100%;
        }
        .logintab input {
            padding: 17px;
            border: 0.5px solid #ccc;
            margin-bottom: 0.5%;
            border-radius: 4px;
            font-size: 17px;
        }
        .logintab button {
            background: #1976d2;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 12px 0;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            transition: background 0.2s;
        }
        .logintab button:hover {
            background: #1565c0;
        }
        .logintab a {
            margin-top: 20px;
            display: block;
            color: #1976d2;
            text-decoration: none;
            font-size: 15px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class = "component">
        <h1>ReciPick</h1>
        <div class ="logintab">
            <form action="/login" method="post">
                <label for="username">ID:</label>
                <input type="text" id="username" name="username" required>
                <br>
                <label for="password">PW:</label>
                <input type="password" id="password" name="password" required>
                <br>
                <button type="submit">로그인</button>
            </form>

            <a href="/register">회원가입</a>
            <!-- 회원가입 넘어가는 링크 -->



        </div>
</body>
</html>
