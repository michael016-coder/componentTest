<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>메인 바탕</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            margin: 0;
            max-height: 100vh;
            background: #faf9f8;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        


        .main-box {
            width: clamp(360px, 50vw, 800px);
            min-height: clamp(300px, 55vh, 650px);
            /* 세로 길이 늘림 */
            padding: clamp(20px, 4vw, 48px);
            background: #fff;
            border-radius: 32px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.13), 0 2px 10px rgba(169, 169, 170, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.02em;
            margin-top: 8vh;
            margin-bottom: 8vh;
            position: relative;
        }
        .mini-add-popup {
            padding: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #fff;
            border-radius: 18px;
            border: 1px solid #333;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.13);
            padding: 28px 22px;
            min-width: 180px;
            max-width: 90vw;
            text-align: center;
            z-index: 30;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .main-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(60, 60, 60, 0.22);
            /* 어두운 반투명 */
            border-radius: 32px;
            z-index: 10;
            pointer-events: none;
        }

/* ----------------------------------------------------------------------추가------------ */

        .fridge-title {
            position: absolute;
            top: 32px;
            left: 40px;
            margin: 0;
            font-size: 2.2rem;
            font-weight: bold;
        }

        .adding-box {
            position: absolute;


            width: 75%;
            height: 90%;
            background: #fff;
            border: 1px solid #f0eeee;
            border-radius: 32px;
            box-shadow: 0 16px 48px rgba(88, 88, 88, 0.13), 0 2px 10px rgba(102, 102, 102, 0.08);
            z-index: 20;
            opacity: 1;
            pointer-events: auto;
        }
        .adding-box h2 {
            text-align: center;
            font-size: 1.8rem;
            margin-bottom: 16px;
            padding-top: 16px;
        }
        .adding-box form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
        }

        .ingredient-list {
            width: 100%;
            margin: 0%;
            display: block;
            flex-wrap: wrap;
            justify-content: center;
            gap: 18px;
            margin-top: 80px;
            /* h2와 간격 */
            padding: 0;
            max-height: 60vh;
            /* 화면 높이의 60% */
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #d9d9d7 #faf9f8;
            list-style: none;

        }

        .ingredient-list li {
            margin: 0 auto 18px auto;
            background: #d7d7d7;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            padding: 18px 32px;
            font-size: 1.1rem;
            color: #333;

            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 90px;
            min-height: 40px;
            max-width: 320px;
            transition: box-shadow 0.2s;

        }

        .ingredient-list::-webkit-scrollbar {
            width: 8px;
            border-radius: 8px;
            background: #faf9f8;
        }

        .ingredient-list::-webkit-scrollbar-thumb {
            background: #d9d9d7;
            border-radius: 8px;
        }

        .ingredient-list li:hover {
            box-shadow: 0 4px 16px rgba(226, 226, 222, 0.096);
            background: #c5c5c4;
        }

        .main-box p {
            font-size: 1.15rem;
            text-align: center;
        }

        /* ...existing code... */
        .side-floating-btns {
            position: absolute;
            right: 32px;
            bottom: 32px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 10;
        }

        .circle-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #d9d9d7;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .circle-btn:hover {
            background: #ffd43b;
        }

        .fa-plus {
            transform: rotate(45deg);
        }

        /* +가 x로 "회전하는건 아직 구현 안함!*/

        .bottom-nav {
            width: clamp(320px, 40vw, 600px);
            /* 더 작게 */
            height: clamp(40px, 6vh, 60px);
            /* 더 작게 */
            padding: clamp(8px, 1vw, 20px);
            /* 더 작게 */
            opacity: 0.95;
            background: linear-gradient(90deg, white 0%, #e0e0e0 100%);
            box-shadow: 0 12px 48px rgba(118, 119, 119, 0.23), 0 4px 16px rgba(0, 0, 0, 0.11);
            border-radius: 999px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            transition: box-shadow 0.2s;
            margin-bottom: 12vh;
        }

        .bottom-nav:hover {
            box-shadow: 0 18px 64px rgba(160, 161, 161, 0.28), 0 8px 24px rgba(0, 0, 0, 0.14);
        }

        .nav-item {
            flex: 1;
            text-align: center;
            text-decoration: none;
            color: #fff;
            transition: transform 0.22s cubic-bezier(.4, 2.3, .3, .9);
        }

        .nav-icon {
            width: 80px;
            height: 80px;
            object-fit: contain;
            display: inline-block;
            vertical-align: middle;
            transition: transform 0.22s cubic-bezier(.4, 2.3, .3, .9);
            filter: drop-shadow(0 1px 8px rgba(230, 232, 233, 0.14));
        }

        .nav-item:hover .nav-icon,
        .nav-item:focus .nav-icon {
            transform: scale(1.18) rotate(-8deg);
            filter: drop-shadow(0 2px 13px rgba(240, 209, 77, 0.29));
            padding-top: clamp(2px, 0.5vw, 4px);
        }

        @media (max-width: 700px) {
            .main-box {
                max-width: 100vw;
                min-height: 260px;
                padding: 8px 2vw;
                margin-top: 4vh;
                margin-bottom: 4vh;

            }

            #profile-button {
                z-index: 2000;
            }

            /* 
            .bottom-nav {
                width: 40vw;
                max-width: none;
                padding: 10px 6vw;
                margin-bottom: 8vh;
            } */

            /* .nav-icon {
                width: 38px;
                height: 38px;
            } */
        }


        footer {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100vw;
            text-align: center;
            font-size: 13px;
            color: #888ca7;
            padding: 10px 0 8px 0;
            background: transparent;
            z-index: 1500;
            pointer-events: none;
            user-select: none;
        }

        footer small a {
            color: #aaa;
            text-decoration: underline;
            pointer-events: auto;
            user-select: auto;
        }

        @media (max-width: 480px) {
            footer {
                font-size: 12px;
                padding: 11px 0 8px 0;
            }
        }
    </style>
</head>

<body>
    <button id="profile-button" class="circle-btn" style="position: fixed; top: 16px; right: 16px; ">
        <i class="fa-solid fa-user"></i></button>
    <div class="main-box">
        <!-- ----------------------------------------추가시작----------------------------------------------- -->
        <div class="main-overlay"></div>
        <!-- ----------------------------------------추가 끝---------------------------------------------- -->
        <h2 class="fridge-title">my fridge</h2>
        <!-- ------------------------------------------------------------------------------------- -->

        <div class="side-floating-btns">

            <button id="add-button" class="circle-btn"><i class="fa-solid fa-plus"></i></button>
            <button id="edit-button" class="circle-btn"><i class="fa-solid fa-pen-to-square"></i></button>
        </div>
        <!-- ------------------------------------------Fridgebasis 대비 달라진부분-------------------- -->
        <div class="adding-box">
            <h2>재료 추가하기</h2>
            <form id="add-ingredient-form">
                <input type="text" id="ingredient-name" placeholder="재료명" required>
            </form>

            <div class="miniadd-popup">
                <h3></h3>
                <p>팝업 내용 예시입니다.</p>
                <button >취소</button>
                <button >선택</button>
                
            </div>












        </div>
        <!-- ------------------------------------------Fridgebasis 대비 달라진부분end---------------- -->
        <ul class="ingredient-list">
            <li>&nbsp;&nbsp;<span class="ingredient-name">재료명 /</span>
                &nbsp;&nbsp;
                <span>수량</span>&nbsp;<span class="quantity">n</span>
                &nbsp;&nbsp;<span>/ (+</span>
                <span class="daycounting">n</span>
                &nbsp;<span>days)</span>
            </li>
            <li>재료</li>
            <li>재료</li>
            <li>재료</li>
            <li>재료</li>
            <li>재료</li>
            <li>재료</li>
            <li>재료</li>
            <li>재료</li>
        </ul>
        <!-- 
                앞선 unsigned list 안에 있는 <li>는 그냥 보여주기용으로 만든 것이고, 실제로는
                    const ingredients = [
                    { name: "계란", quantity: 5, day: 10 },
                    { name: "우유", quantity: 2, day: 5 },
                    { name: "감자", quantity: 8, day: 7 }
                  ];
              
                  이런식으로 script에 추가할 것.
                  const listEl = document.querySelector('.ingredient-list');
                  ingredients.forEach(item => {
                    const li = document.createElement('li');
                    li.innerHTML = `
                      <span class="ingredient-name">${item.name} /</span>
                      <span>수량 </span><span class="quantity">${item.quantity}</span>
                      <span> / (+</span><span class="daycounting">${item.day}</span> <span>days)</span>
                    `;
                    listEl.appendChild(li);
                  });
                  

                  즉, 현재는 <ul></ul> 만 만들어 놓은것. 배열을 이용한 함수를 만드려고. -->

    </div>


    


    </div>
    <nav class="bottom-nav">
        <a href="#" class="nav-item" title="나의 냉장고">
            <img src="icons/RefrigeratorIcon.png" alt="Refrigerator Icon" class="nav-icon">
        </a>
        <a href="#" class="nav-item" title="레시피 탐색">
            <img src="icons/searchIcon.png" alt="Search Icon" class="nav-icon">
        </a>
        <a href="#" class="nav-item" title="장바구니">
            <img src="icons/addCartIcon.png" alt="Add Cart Icon" class="nav-icon">
        </a>
        <a href="#" class="nav-item" title="히스토리">
            <img src="icons/HistoryIcon.png" alt="History Icon" class="nav-icon">
        </a>
    </nav>
    <footer>
        <small>
            Icons by <a href="https://www.flaticon.com/authors/freepik" target="_blank" rel="noopener">Freepik</a> /
            Powered by <a href="https://fontawesome.com/" target="_blank" rel="noopener">Font Awesome</a>
        </small>
    </footer>
</body>

</html>
